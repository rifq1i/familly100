<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Family 100: Jejak Sejarah Indonesia</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="muteBtn" class="mute" aria-label="Suara">🔊</button>

    <section id="setup" class="screen active">
      <h1>Family 100</h1>
      <p class="sub">Jejak Sejarah Indonesia</p>
      <div class="panel">
        <label
          >Nama Tim 1 <input id="t1" value="" maxlength="18"
        /></label>
        <label
          >Nama Tim 2 <input id="t2" value="" maxlength="18"
        /></label>
        <label
          >Pilihan materi
          <select id="bab">
            <option value="bab1">
              Mempertahankan Kemerdekaan 1945–1949
            </option>
            <option value="bab2">Demokrasi Liberal 1950–1959</option>
            <option value="all">Gabungan 1945–1959</option>
          </select></label
        >
        <label
          >Jumlah pertanyaan
          <select id="jml"></select
        ></label>
        <label
          >Waktu per jawaban (detik)
          <select id="waktu">
            <option>10</option>
            <option selected>20</option>
            <option>30</option>
            <option>45</option>
          </select></label
        >
        <button id="mulai" class="btn">Mulai Permainan</button>
      </div>
    </section>

    <section id="game" class="screen">
      <div class="top">
        <div class="team" id="tm0"><b id="n0"></b><span id="s0">0</span></div>
        <div class="center">
          <div class="info" id="babInfo"></div>
          <div class="pot">Poin ronde: <b id="pot">0</b></div>
          <div class="timer" id="timer">20</div>
        </div>
        <div class="team" id="tm1"><b id="n1"></b><span id="s1">0</span></div>
      </div>
      <h2 id="soal"></h2>
      <div id="banner"></div>
      <div class="strikes" id="strikes"></div>
      <div id="board" class="board"></div>
      <div class="ctrl">
        <input
          id="jawab"
          placeholder="Ketik jawaban lalu tekan Enter"
          autocomplete="off"
        />
        <button id="kirim" class="btn">Jawab</button>
        <button id="lewat" class="btn ghost">Salah / Lewati</button>
        <button id="lanjut" class="btn hidden">Soal Berikutnya</button>
      </div>
    </section>

    <section id="end" class="screen">
      <h1>Permainan Selesai</h1>
      <p class="sub" id="juara"></p>
      <div class="panel final" id="akhir"></div>
      <button id="ulang" class="btn">Main Lagi</button>
    </section>
    <script src="questions.js"></script>
    <script src="game.js"></script>
  </body>
</html>
